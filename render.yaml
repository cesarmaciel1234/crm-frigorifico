# Deploy en Render.com — Master Total (Flask + PostgreSQL)
# https://github.com/cesarmaciel1234/crm-frigorifico

databases:
  - name: crm-db
    plan: free
    databaseName: crm_frigorifico
    user: crm_user

services:
  - type: web
    name: crm-frigorifico
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_icons.py
    startCommand: python start_produccion.py
    healthCheckPath: /health/ready
    envVars:
      - key: MT_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MT_API_KEY
        generateValue: true
      - key: AUDIT_DELETE_PASSWORD
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: RENDER
        value: "true"
      # Informe empresarial por email (Resend HTTPS)
      - key: REPORT_EMAIL_TO
        sync: false
      - key: REPORT_CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: REPORT_TIMEZONE
        value: America/Argentina/Buenos_Aires

  # Lunes 05:00 Argentina (08:00 UTC) — informe empresarial por email
  - type: cron
    name: crm-informe-semanal
    runtime: python
    plan: free
    schedule: "0 8 * * 1"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/trigger_informe_cron.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: crm-frigorifico
          envVarKey: RENDER_EXTERNAL_URL
      - key: REPORT_CRON_SECRET
        fromService:
          type: web
          name: crm-frigorifico
          envVarKey: REPORT_CRON_SECRET
