# Deploy en Render.com — Master Total (Flask + PostgreSQL)
# https://github.com/cesarmaciel1234/crm-frigorifico

databases:
  - name: crm-db
    plan: free
    databaseName: crm_frigorifico
    user: crm_user

services:
  - type: web
    name: crm-frigorifico
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_icons.py
    startCommand: python start_produccion.py
    healthCheckPath: /health/ready
    envVars:
      - key: MT_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MT_API_KEY
        generateValue: true
      - key: AUDIT_DELETE_PASSWORD
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: RENDER
        value: "true"
      # Informe diario por email — configurar en el panel de Render (no commitear secretos)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: REPORT_EMAIL_TO
        sync: false
      - key: REPORT_CRON_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
