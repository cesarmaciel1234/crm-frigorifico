# Deploy en Render.com (HTTPS gratis — requerido para PWA en iPhone)
# Conectar repo: https://github.com/cesarmaciel1234/crm-frigorifico
services:
  - type: web
    name: crm-frigorifico
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_icons.py
    startCommand: python start_produccion.py
    envVars:
      - key: MT_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.0
